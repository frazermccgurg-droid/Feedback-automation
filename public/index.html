<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHARUSAT Feedback Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #00ff88;
      --accent2: #0088ff;
      --warn: #ffaa00;
      --error: #ff4466;
      --text: #e0e0f0;
      --muted: #666688;
      --card: #13131f;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .logo-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      padding: 6px 14px;
      border-radius: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Form grid */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,255,136,0.1);
    }

    select option { background: var(--surface); }

    /* Button */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 32px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #00cc6a);
      color: #000;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,255,136,0.3);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-stop {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
      display: none;
      margin-top: 8px;
    }

    .btn-stop:hover { background: rgba(255,68,102,0.1); }

    /* Status bar */
    .status-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(0,255,136,0.05);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 8px;
      margin-bottom: 16px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
    }

    .status-bar.active { display: flex; }

    .pulse {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s infinite;
      flex-shrink: 0;
    }

    /* Log terminal */
    .terminal {
      background: #050508;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    .terminal.active { display: block; }

    .terminal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f57; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #28c840; }

    .terminal-title {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
    }

    .log-output {
      padding: 20px;
      height: 420px;
      overflow-y: auto;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.8;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .log-output::-webkit-scrollbar { width: 4px; }
    .log-output::-webkit-scrollbar-track { background: transparent; }
    .log-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-line { display: flex; gap: 12px; align-items: flex-start; }
    .log-time { color: var(--muted); flex-shrink: 0; font-size: 11px; padding-top: 2px; }

    .log-info    { color: #aabbcc; }
    .log-subject { color: var(--accent2); font-weight: 700; }
    .log-faculty { color: #cc88ff; }
    .log-radio   { color: var(--muted); }
    .log-success { color: var(--accent); font-weight: 700; }
    .log-error   { color: var(--error); }
    .log-alert   { color: var(--warn); }
    .log-done    { color: var(--accent); font-weight: 700; font-size: 15px; }

    /* Stats */
    .stats {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .stats.active { display: grid; }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      font-size: 36px;
      font-weight: 800;
      font-family: 'Space Mono', monospace;
      line-height: 1;
    }

    .stat-number.green { color: var(--accent); }
    .stat-number.red   { color: var(--error); }

    .stat-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
      font-family: 'Space Mono', monospace;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge">CHARUSAT AUTO-BOT</div>
      <h1>Faculty Feedback<br/>Automation</h1>
      <p class="subtitle">// fills all subjects & faculties automatically</p>
    </header>

    <!-- Config Form -->
    <div class="card">
      <div class="card-title">Configuration</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Feedback Page URL</label>
          <input type="text" id="feedbackUrl" placeholder="Paste feedback URL here e.g. http://136.233.130.148:8082/feedback/" />
        </div>
        <div class="form-group full">
          <label>Student ID</label>
          <input type="text" id="studentId" placeholder="Enter your Student ID e.g. 23CE077" />
        </div>
        <div class="form-group">
          <label>Institute</label>
          <select id="institute">
            <option value="" disabled selected>-- Select Institute --</option>
            <option value="CSPIT">CSPIT</option>
            <option value="DEPSTAR">DEPSTAR</option>
            <option value="CMPICA">CMPICA</option>
          </select>
        </div>
        <div class="form-group">
          <label>Programme</label>
          <select id="programme">
            <option value="" disabled selected>-- Select Programme --</option>
            <option value="B.Tech.">B.Tech.</option>
            <option value="M.Tech.">M.Tech.</option>
            <option value="MCA">MCA</option>
          </select>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select id="department">
            <option value="" disabled selected>-- Select Department --</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
          </select>
        </div>
        <div class="form-group">
          <label>Semester</label>
          <select id="semester">
            <option value="" disabled selected>-- Select Semester --</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" id="startBtn" onclick="startAutomation()">
        <span id="btnIcon">▶</span>
        <span id="btnText">START AUTOMATION</span>
      </button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopAutomation()">
        ■ STOP
      </button>
    </div>

    <!-- Live status -->
    <div class="status-bar" id="statusBar">
      <div class="pulse"></div>
      <span id="statusText">Automation running...</span>
    </div>

    <!-- Terminal -->
    <div class="terminal" id="terminal">
      <div class="terminal-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span class="terminal-title">feedback-bot — live output</span>
      </div>
      <div class="log-output" id="logOutput"></div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-number green" id="successCount">0</div>
        <div class="stat-label">Submitted</div>
      </div>
      <div class="stat-card">
        <div class="stat-number red" id="failCount">0</div>
        <div class="stat-label">Failed</div>
      </div>
    </div>

    <footer>built for CHARUSAT students &mdash; automated feedback bot</footer>
  </div>

  <script>
    // Point to your Render backend URL
    const API_BASE = window.location.origin;

    let eventSource = null;
    let successCount = 0;
    let failCount = 0;

    function now() {
      return new Date().toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function appendLog(type, message) {
      const out = document.getElementById("logOutput");
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerHTML = `<span class="log-time">${now()}</span><span class="log-${type}">${message}</span>`;
      out.appendChild(line);
      out.scrollTop = out.scrollHeight;

      if (type === "success") {
        successCount++;
        document.getElementById("successCount").textContent = successCount;
      }
      if (type === "error") {
        failCount++;
        document.getElementById("failCount").textContent = failCount;
      }
    }

    async function startAutomation() {
      const url        = document.getElementById("feedbackUrl").value.trim();
      const studentId  = document.getElementById("studentId").value.trim();
      const institute  = document.getElementById("institute").value;
      const programme  = document.getElementById("programme").value;
      const department = document.getElementById("department").value;
      const semester   = document.getElementById("semester").value;

      if (!url) { alert("Please enter the Feedback Page URL"); return; }
      if (!studentId) { alert("Please enter your Student ID"); return; }

      // Reset UI
      successCount = 0; failCount = 0;
      document.getElementById("successCount").textContent = "0";
      document.getElementById("failCount").textContent = "0";
      document.getElementById("logOutput").innerHTML = "";
      document.getElementById("startBtn").disabled = true;
      document.getElementById("btnIcon").innerHTML = '<div class="spinner"></div>';
      document.getElementById("btnText").textContent = "RUNNING...";
      document.getElementById("stopBtn").style.display = "flex";
      document.getElementById("statusBar").classList.add("active");
      document.getElementById("terminal").classList.add("active");
      document.getElementById("stats").classList.add("active");

      try {
        const res = await fetch(`${API_BASE}/api/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentId, institute, programme, department, semester, url }),
        });
        const { jobId } = await res.json();

        eventSource = new EventSource(`${API_BASE}/api/logs/${jobId}`);
        eventSource.onmessage = (e) => {
          const { type, message } = JSON.parse(e.data);
          if (type === "end") {
            finishUI();
          } else {
            appendLog(type, message);
          }
        };
        eventSource.onerror = () => {
          appendLog("error", "Connection lost.");
          finishUI();
        };
      } catch (err) {
        appendLog("error", `Failed to connect: ${err.message}`);
        finishUI();
      }
    }

    function stopAutomation() {
      if (eventSource) { eventSource.close(); eventSource = null; }
      appendLog("error", "⛔ Automation stopped by user.");
      finishUI();
    }

    function finishUI() {
      document.getElementById("startBtn").disabled = false;
      document.getElementById("btnIcon").textContent = "▶";
      document.getElementById("btnText").textContent = "START AUTOMATION";
      document.getElementById("stopBtn").style.display = "none";
      document.getElementById("statusBar").classList.remove("active");
      document.getElementById("statusText").textContent = "Automation running...";
    }
  </script>
</body>
</html>
